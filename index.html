<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Gps Tracker</h1>
    <button id="startBtn">start</button>

    <button id="stopBtn">stop</button>

    <button id="downloadBtn">download</button>

    <div id="status"></div>
    <div id="uploads"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

        import {
            getAuth,
            signInAnonymously,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

        import {
            initializeFirestore,
            persistentLocalCache,
            doc,
            setDoc,
            updateDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyNKcoAFL_9C5aEvVm7PnLN2KW4hnrrNk",
            authDomain: "gps-tracker-95578.firebaseapp.com",
            projectId: "gps-tracker-95578",
            appId: "1:55561269410:web:604bc806c39f1a9bbea7fb",
            //storageBucket: "gps-tracker-95578.firebasestorage.app",
            //messagingSenderId: "55561269410",
            //measurementId: "G-2WMFDDZXF2"
        };
        const app = initializeApp(firebaseConfig)
        const auth = getAuth(app)
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache()
        });
        let currentUid = null
        let authReady = false
        let sessionId = null
        let seqNum = 0
        let uploadCount = 0

        signInAnonymously(auth).catch((error) => {
            console.log("Authentication Failed: ", error)
            document.getElementById("status").textContent = `Sign-in failed: ${error.code}`;

        });

        onAuthStateChanged(auth, (user) => {
            if(user){
                currentUid = user.uid;
                authReady = true;
                console.log("Authenticated: ", currentUid)
            }
        });

        let watchId = null;
        const readings = [];
        let deviceId = localStorage.getItem("deviceId");
        if (!deviceId){
            deviceId = crypto.randomUUID();
            localStorage.setItem("deviceId", deviceId);
        }
        const options = {
            enableHighAccuracy: true,
            maximumAge: 0
        };

        function onSuccess(position) {
            const documentId = `${deviceId}_${position.timestamp}`;
            const reference = doc(db, "gps_fixes", documentId);
            const positionData = {
                uid: currentUid,
                sessionId: sessionId,
                deviceId:   deviceId,
                timestamp:  position.timestamp,
                latitude:   position.coords.latitude,
                longitude:  position.coords.longitude,
                accuracy:   position.coords.accuracy,
                altitude:   position.coords.altitude,
                speed:      position.coords.speed,
                heading:    position.coords.heading,
                seq: seqNum++,
                receivedAt: serverTimestamp()
            };
            setDoc(reference, positionData)
            .then(() => {
                uploadCount++;
                console.log("Uploaded to Firebase: ",documentId)
                document.getElementById("uploads").textContent = `Uploaded: ${uploadCount} / ${readings.length}`;
            })
            .catch((error) => {
                console.log("Failed to upload to Firebase: ", error)
                document.getElementById("uploads").textContent = `Upload failed: ${error.code}`;
            });
            readings.push(positionData);
            let status = document.getElementById("status");
            status.textContent = `Latitude: ${positionData.latitude}
            Longitude: ${positionData.longitude}
            Accuracy: ${positionData.accuracy}
            Readings: ${readings.length}`;
        }

        function onError(err){
            const error = {
                code:    err.code,
                message: err.message
            };
            let status = document.getElementById("status");
            status.textContent = `Error ${error.code}: ${error.message}`;
        }

        function startTracking(){
            if(!authReady || !currentUid){
                console.log("Waiting Authentication..");
                return;
            }
            document.getElementById("status").textContent = "Start button clicked";
            if(watchId === null){
                seqNum = 0;
                uploadCount = 0;
                sessionId = crypto.randomUUID();
                watchId = navigator.geolocation.watchPosition(onSuccess, onError, options);
            }
        }

        function stopTracking(){
            if(watchId !== null){
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }

        function getCsv() {
            const header = "deviceId,timestamp,latitude,longitude,accuracy,altitude,speed,heading";
            const rows = readings.map(reading => {
                const row = `${reading.deviceId},`+
                `${new Date(reading.timestamp).toISOString()},`+
                `${reading.latitude},`+
                `${reading.longitude},`+
                `${reading.accuracy},`+
                `${reading.altitude === null ? "" : reading.altitude},`+
                `${reading.speed    === null ? "" : reading.speed},`+
                `${reading.heading  === null ? "" : reading.heading}`
                return row;
            });
            return [header, ...rows].join("\n")
        }

        function downloadCSV(){
            console.log("Number of readings:", readings.length);
            const csvString = getCsv();
            const blob = new Blob([csvString], {type: "text/csv"});
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "gps.csv";
            link.click()
            URL.revokeObjectURL(url)
        }
    
        document.getElementById("startBtn").addEventListener("click", startTracking);
        document.getElementById("stopBtn").addEventListener("click", stopTracking);
        document.getElementById("downloadBtn").addEventListener("click", downloadCSV);

    </script>
</body>
</html>
